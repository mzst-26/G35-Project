name: CI Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Clear Next.js build cache
      #   run: rm -rf .next

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-shared-packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: CI guards (lockfile and shared builds)
        run: npm run ci:guard

      - name: Install backend dependencies
        run: npm ci

      - name: Test shared packages
        run: npm run test:shared

      - name: Build shared packages
        run: npm run build:shared

      - name: Test core-platform service
        run: npm run test -w @infra/core-platform-service && npm run typecheck -w @infra/core-platform-service
