name: CI Pipeline

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Clear Next.js build cache
      #   run: rm -rf .next

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
