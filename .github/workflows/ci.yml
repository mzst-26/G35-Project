# Single CI workflow: frontend + identity.
# PR: frontend lint/build, identity test + image build (no push).
# Push to main/dev: identity test + image build + push (only when backend/** changes).

name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/identity-service

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: paths
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: rm -rf .next && npm run build

  identity:
    name: Identity
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.backend == 'true' || github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Test
        run: |
          cd backend && npm ci
          npm run build -w @infra/shared-utils -w @infra/identity-service
          npm run test -w @infra/identity-service
      - name: Docker meta
        id: meta
        run: |
          SHA_FULL=$(git rev-parse HEAD)
          SHA_SHORT=$(git rev-parse --short HEAD)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "sha_full=$SHA_FULL" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=$IMAGE:pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=$IMAGE:latest,$IMAGE:sha-$SHA_SHORT" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:${{ github.ref_name }},$IMAGE:${{ github.ref_name }}-$SHA_SHORT" >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/services/identity/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha_full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false