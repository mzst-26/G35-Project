version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: infra
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      args:
        GIT_SHA: local-dev
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      PORT: 4001
    env_file:
      - ./services/identity/.env
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  core-platform:
    build:
      context: .
      dockerfile: services/core-platform/Dockerfile
      args:
        GIT_SHA: local-dev
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
    env_file:
      - ./services/core-platform/.env
    depends_on:
      - identity
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
