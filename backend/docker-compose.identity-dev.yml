# Identity service from GHCR — matches Oracle deployment (image, env, healthcheck, resources).
# Run: npm run dev:identity  (pulls latest :dev and starts)
#
# Prerequisites: .env.development with valid SUPABASE_*, COOKIE_SECRET, etc.
# For private GHCR images: docker login ghcr.io -u <user>
#
# Resource limits mirror Oracle Always Free (identity VM: 1 OCPU, 6GB).
# See backend/docs/oracle-always-free-allocation.md. Use 512M on 16GB laptops.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  identity:
    image: ghcr.io/mzst-26/identity-service:dev
    container_name: identity-service-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    env_file:
      - ./services/identity/.env.development
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
